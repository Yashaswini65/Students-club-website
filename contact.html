<section class="page">

    <h2>Contact Us</h2>

    <p>
        Have questions or want to join our club?
        Contact us using the form below.
    </p>

    <form>

        <label>Name</label>

        <input type="text"
               placeholder="Enter your name">

        <label>Email</label>

        <input type="email"
               placeholder="Enter your email">

        <label>Message</label>

        <textarea
            placeholder="Enter your message">
        </textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</footer>
